stages:
  - build-image

# Define variables, overrides and openUSD version based on branch name.
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  USD_VERSION: "${CI_COMMIT_BRANCH}"
  USD_TARBALL_URL: "https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v${CI_COMMIT_BRANCH}.tar.gz"
  PYTHON_VERSION: "3.10.14"
  GCCCORE_VERSION: "12.3.0"
  PYTHON_PREFIX: "/pipeline/el9/software/Python/${PYTHON_VERSION}-GCCcore-${GCCCORE_VERSION}"
  PYTHON_BIN: "${PYTHON_PREFIX}/bin/python"
  DOCKER_CONTAINER_VER: "1"

# The docker authentication elements
.docker-auth:
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-ci"
    - mkdir -p "$DOCKER_CONFIG"
    - REGISTRY_AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$REGISTRY_AUTH" > "$DOCKER_CONFIG/config.json"
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.docker-ci"

# Build Docker container elements incl build-args
.build-image-template:
  stage: build-image
  tags:
    - shell
  extends: .docker-auth
  rules:
    - if: $CI_COMMIT_BRANCH =~ "docker"
      changes:
        - docker/Dockerfile.*
        - .gitlab-ci.yml
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE:${IMAGE_TAG}"
      docker pull "$IMAGE" || true
      docker build \
        --cache-from "$IMAGE" \
        --build-arg USD_VERSION="$USD_VERSION" \
        --build-arg USD_TARBALL_URL="$USD_TARBALL_URL" \
        --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
        --build-arg GCCCORE_VERSION="$GCCCORE_VERSION" \
        -t "$IMAGE" \
        -f "$DOCKERFILE" .
      docker push "$IMAGE"

# Execute docker container builds in parallel
build_image:
  extends: .build-image-template
  parallel:
    matrix:
      - IMAGE_TAG: "alma9"
        DOCKERFILE: "docker/Dockerfile.alma9"
      - IMAGE_TAG: "rocky9"
        DOCKERFILE: "docker/Dockerfile.rocky9"

