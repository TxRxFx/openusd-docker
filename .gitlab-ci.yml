# This is purely to not make this run on gitlab.com
workflow:
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.com"'
      when: never
    - when: always
# End of gitlab.com check

stages:
  - compile

variables:
  USD_VERSION: "${CI_COMMIT_BRANCH}"
  PYTHON_VERSION: "3.10.14"
  GCCCORE_VERSION: "12.3.0"
  DOCKER_CONTAINER_VER: "1"
  BUILD_SCRIPT: "scripts/check_existing_docker_access.sh"

compile_usd:
  stage: compile
  tags:
    - docker
    - linux

  image: "${CI_REGISTRY_IMAGE}:${PLATFORM}-py${PYTHON_VERSION}-v${DOCKER_CONTAINER_VER}"

  timeout: 4h

  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^\d{2}\.\d{2}\.\d+$/'

  parallel:
    matrix:
      # - PLATFORM: [alma9, rocky9]
      - PLATFORM: [rocky9]

  script:
    - |
      set -euo pipefail

      echo "Checking available Python installations..."

      ls -la /mnt/packages/apps/external/

      find /mnt/packages/apps/external/ \
        -maxdepth 7 \
        -name python3.10 \
        -type f \
        -print


      # bash "$BUILD_SCRIPT"      
      echo "*************"
      #   "$USD_VERSION" \
      #   "$PLATFORM" \
      #   "artifacts/$PLATFORM"

      # test -s "artifacts/$PLATFORM/OpenUSD_install.tar.gz"
      # test -s "artifacts/$PLATFORM/OpenUSD_build.tar.gz"
      # test -s "artifacts/$PLATFORM/OpenUSD_3rdparty_inst.tar.gz"
      # test -s "artifacts/$PLATFORM/OpenSubdiv.tar.gz"

      # echo "OpenUSD $USD_VERSION ($PLATFORM) compiled successfully"

  artifacts:
    name: "openusd-${CI_COMMIT_REF_SLUG}-${PLATFORM}"
    paths:
      - artifacts/
    expire_in: 14 days
