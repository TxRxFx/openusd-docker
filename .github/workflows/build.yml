name: Build OpenUSD Docker Images and Compile

on:
  push:
    branches:
      - '[0-9][0-9].[0-9][0-9].[0-9]+'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/txrxfx/openusd-docker
  DOCKER_BUILDKIT: '1'
  PYTHON_VERSION: '3.10.14'
  GCCCORE_VERSION: '12.3.0'


jobs:
  build-image:
    name: Build Docker Images
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: alma9
            dockerfile: docker/Dockerfile.alma9
          - name: rocky9
            dockerfile: docker/Dockerfile.rocky9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from branch
        id: version
        shell: bash
        run: |
            VERSION="$GITHUB_REF_NAME"

            if [[ ! "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid version branch: $VERSION" >&2
            exit 1
            fi

            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.platform.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.platform.name }}
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.platform.name }}-${{ steps.version.outputs.version }}
          build-args: |
            USD_VERSION=${{ steps.version.outputs.version }}
            USD_TARBALL_URL=https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            GCCCORE_VERSION=${{ env.GCCCORE_VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ matrix.platform.name }}
          cache-to: type=inline

  compile-usd:
    name: Compile OpenUSD
    needs: build-image
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240  # 4 hours
    permissions:
        contents: read
        packages: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: alma9
          - name: rocky9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from branch
        id: version
        shell: bash
        run: |
            VERSION="$GITHUB_REF_NAME"

            if [[ ! "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid version branch: $VERSION" >&2
            exit 1
            fi

            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile OpenUSD in ${{ matrix.platform.name }}
        run: |
          set -e
          
          IMAGE="${{ env.REGISTRY_IMAGE }}:${{ matrix.platform.name }}-${{ steps.version.outputs.version }}"
          

          
          # Pull the image
          docker pull "${IMAGE}"
          
          # Prepare host-side artifacts directory
          mkdir -p artifacts
          # Run compilation in container
          docker run --rm \
            -v "$(pwd)/artifacts:/artifacts" \
            "${IMAGE}" \
            bash -c '
              set -e
              
              # Source GCC toolset
              source /opt/rh/gcc-toolset-12/enable
              
              # Verify toolchain
              gcc --version
              g++ --version
              
              # Verify Python
              PYTHON_BIN="/pipeline/el9/software/Python/${{ env.PYTHON_VERSION }}-GCCcore-${{ env.GCCCORE_VERSION }}/bin/python"
            #   PYTHON_BIN="${{ env.PYTHON_PREFIX }}/bin/python"
              test -x "${PYTHON_BIN}"
              "${PYTHON_BIN}" --version
              
              # Download OpenUSD
              mkdir -p /tmp/OpenUSD
              curl -L "https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz" \
                -o /tmp/OpenUSD.tar.gz
              tar -xzf /tmp/OpenUSD.tar.gz --strip-components=1 -C /tmp/OpenUSD
              
              # Verify build subdirectory exists after extraction
              test -d /tmp/OpenUSD/_inst/include/opensubdiv || (
                echo "Note: opensubdiv may not be pre-built in this USD version" >&2
              )
              
              # Run the build
              "${PYTHON_BIN}" /tmp/OpenUSD/build_scripts/build_usd.py \
                /tmp/OpenUSD/_install \
                --src /tmp/OpenUSD/_src \
                --build /tmp/OpenUSD/_build \
                --inst /tmp/OpenUSD/_inst \
                --build-variant release \
                --python \
                --usd-imaging \
                --usdview \
                --no-tests \
                --no-examples \
                --no-tutorials \
                --no-docs \
                --no-python-docs \
                --materialx \
                --embree
              
              # Extract OpenSubdiv artifacts
              mkdir -p /tmp/OpenUSD/_artifacts/OpenSubdiv/include /tmp/OpenUSD/_artifacts/OpenSubdiv/lib
              if [ -d /tmp/OpenUSD/_inst/include/opensubdiv ]; then
                cp -a /tmp/OpenUSD/_inst/include/opensubdiv /tmp/OpenUSD/_artifacts/OpenSubdiv/include/
              fi
              
              # Copy OpenSubdiv libraries
              if [ -d /tmp/OpenUSD/_inst/lib ]; then
                find /tmp/OpenUSD/_inst/lib -maxdepth 1 -type f \( -name "libosd*.so*" -o -name "libosd*.a" \) \
                  -exec cp -a {} /tmp/OpenUSD/_artifacts/OpenSubdiv/lib/ \;
              fi
              if [ -d /tmp/OpenUSD/_inst/lib64 ]; then
                find /tmp/OpenUSD/_inst/lib64 -maxdepth 1 -type f \( -name "libosd*.so*" -o -name "libosd*.a" \) \
                  -exec cp -a {} /tmp/OpenUSD/_artifacts/OpenSubdiv/lib/ \;
              fi
              
              # Verify OpenSubdiv lib was copied
              test -d /tmp/OpenUSD/_inst/include/opensubdiv
              test -n "$(ls -A /tmp/OpenUSD/_artifacts/OpenSubdiv/lib)"
              
              
              # Create artifact tarballs
              mkdir -p /artifacts
              tar -C /tmp/OpenUSD -czf /artifacts/OpenUSD_install.tar.gz _install
              tar -C /tmp/OpenUSD -czf /artifacts/OpenUSD_build.tar.gz _build
              tar -C /tmp/OpenUSD -czf /artifacts/OpenUSD_3rdparty_inst.tar.gz _inst
              tar -C /tmp/OpenUSD/_artifacts -czf /artifacts/OpenSubdiv.tar.gz OpenSubdiv
              
              # Copy build log if it exists
              if [ -f /tmp/OpenUSD/_build/OpenUSD/log.txt ]; then
                cp /tmp/OpenUSD/_build/OpenUSD/log.txt /artifacts/log.txt
              fi
              
              echo "Artifacts created successfully"
              ls -lh /artifacts/
            '

      - name: Verify artifacts
        run: |
          mkdir -p artifacts
          ls -lh artifacts/ || echo "No artifacts directory found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openusd-${{ matrix.platform.name }}-${{ steps.version.outputs.version }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
