name: Build OpenUSD

on:
  push:
    branches:
      # Match version branches: 25.05.1, 26.01.2, etc.
      - '[0-9][0-9].[0-9][0-9].[0-9]*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: '1'

jobs:
  compile-usd:
    name: Compile OpenUSD
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240  # 4 hours
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - alma9
          - rocky9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from branch
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ ! "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid version branch: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run build script
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/build-openusd.sh \
            --platform "$PLATFORM" \
            --version "$VERSION" \
            --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openusd-${{ matrix.platform }}-${{ steps.version.outputs.version }}
          path: artifacts/${{ matrix.platform }}/
          retention-days: 14
          if-no-files-found: warn
